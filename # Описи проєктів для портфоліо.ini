## 4. AndroidCalc

**Проблема:** Замовнику — Харківському водоканалу — потрібен був надійний, готовий до інтеграції мобільний калькулятор із сучасним інтерфейсом для внутрішнього використання.

**Рішення:** AndroidCalc — завершений мобільний застосунок-калькулятор для Android, розроблений на замовлення **Харківського водоканалу**. Проєкт реалізує повний набір базових математичних операцій у чистому, добре задокументованому коді, готовому до подальшого розширення функціоналу та інтеграції в більші системи замовника.

**Платформа:** Android

**Технологічний стек:** Android Studio, Java/Kotlin

**Ключові особливості:**
- Розроблено на замовлення Харківського водоканалу
- Сучасний і чуйний UI/UX дизайн
- Повна підтримка базових математичних операцій
- Адаптивність під різні роздільні здатності екрана
- Чистий, документований код, готовий до розширення та інтеграції

**Репозиторій:** [GitHub](https://github.com/sunkompotus454jg/CalcNew-Studio-.git)

