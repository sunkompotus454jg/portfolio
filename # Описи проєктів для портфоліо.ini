## 3. DeckBoard

**Проблема:** Керування комп'ютером під час стрімів, презентацій чи звичайної роботи часто вимагає постійного перемикання між клавіатурою і мишею для простих дій — вимкнення мікрофона, запуску запису в OBS чи відкриття потрібної програми.

**Рішення:** DeckBoard — екосистема з двох частин: Android-застосунок і Python-сервер на ПК, які утворюють повноцінну «стрім-панель» дистанційного керування. Через мобільний застосунок користувач одним дотиком керує звуком, записом в OBS та запуском будь-яких програм на комп'ютері, а сервер автоматично виявляється в локальній мережі, що робить підключення практично миттєвим.

**Платформа:** Android + Windows

**Технологічний стек:** Kotlin (Android), Retrofit2, Python, Flask, OBS-WebSocket, PyCaw, PyStray

**Ключові особливості:**
- Кастомізовані плитки керування з підтримкою Drag & Drop
- Автоматичний пошук сервера в локальній мережі або ручне підключення за IP
- Керування системним звуком і мікрофоном одним дотиком
- Дистанційний старт/стоп запису через інтеграцію з OBS WebSocket
- Запуск довільних програм і ярликів (.exe, .lnk, .url) із системного трея
- Модульна структура репозиторію (окремо Android-клієнт і PC-сервер)

**Репозиторій:** [GitHub](https://github.com/sunkompotus454jg/DeckBoard_Final.git)

