# Описи проєктів для портфоліо

---

## 1. Nestly

**Проблема:** Стандартний робочий стіл Windows швидко перетворюється на хаотичне нагромадження ярликів і файлів, а вбудовані інструменти системи не дають гнучких способів організувати простір під себе.

**Рішення:** Nestly — легковажна утиліта для Windows, яка вводить систему «сіток» (Fences) для групування ярликів. Вікна сіток автоматично згортаються в тонку панель, коли курсор залишає їхні межі, і розгортаються при наведенні, звільняючи візуальний простір. Магнітне прилипання сіток одна до одної та до країв екрана (з точністю до 20 пікселів) дозволяє вибудувати ідеально впорядкований робочий стіл без ручного вирівнювання.

**Платформа:** Windows Desktop

**Технологічний стек:** Python, PyQt6, Windows API

**Ключові особливості:**
- Автоматичне згортання та розгортання сіток при наведенні курсора
- Магнітне прилипання (snapping) з точністю 20 px
- 5 вбудованих неонових пресетів оформлення + власний пресет за HEX-кодом
- Безпечне переміщення файлів назад на робочий стіл при видаленні сітки
- Інтеграція з контекстним меню Windows та автозапуск разом із системою
- Підтримка Drag & Drop
- Повноцінний інсталятор для встановлення в кілька кліків

**Репозиторій:** [GitHub](https://github.com/sunkompotus454jg/Nesty.git)

