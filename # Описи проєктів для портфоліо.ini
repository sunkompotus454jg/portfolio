## 2. Aether

**Проблема:** Під час навчання чи роботи студентам і фахівцям часто бракує швидкого способу отримати стислу підказку на основі того, що вони чують або бачать на екрані, — без перемикання між вікнами й відволікання від основного процесу.

**Рішення:** Aether — десктопний AI-асистент, що працює як напівпрозорий overlay поверх усіх вікон. Програма захоплює аудіо з мікрофона та транскрибує його через Groq Whisper, а також розпізнає текст на екрані за допомогою Gemini Vision (OCR). Отримані дані передаються у Groq LLM, який генерує стислу й точну відповідь просто на екрані користувача. Окрема функція робить overlay невидимим під час демонстрації екрана, що дозволяє використовувати асистента непомітно.

**Платформа:** Windows 10/11

**Технологічний стек:** Electron, Vanilla JS, Groq LLM (Whisper + LLM), Google Gemini Flash (Vision/OCR)

**Ключові особливості:**
- Захоплення та транскрипція аудіо в реальному часі
- OCR вибраної області екрана
- Генерація відповідей через LLM на основі аудіо та візуальних даних
- Режим невидимості під час демонстрації екрана
- Повний набір гарячих клавіш для керування без відриву від основного завдання
- Налаштування власних API-ключів (Groq, Gemini) безпосередньо в програмі

**Репозиторій:** [GitHub](https://github.com/sunkompotus454jg/Aether.git)

