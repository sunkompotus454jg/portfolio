## 5. HomeCinema

**Проблема:** Комерційні стрімінгові сервіси залежать від інтернет-з'єднання, підписок і зовнішніх серверів, тоді як багато користувачів мають власну медіатеку та хочуть переглядати її на телевізорі без затримок і сторонніх обмежень.

**Рішення:** HomeCinema — локальний медіасервер, що поєднує телевізори на Android TV з мережевим сховищем (NAS) у домашній мережі. Проєкт відтворює звичний досвід популярних стрімінгових платформ — зручний каталог, обкладинки, описи — але повністю локально, без затримок і залежності від зовнішніх серверів. Веб-адмінка дозволяє легко поповнювати бібліотеку, а метадані фільмів підтягуються автоматично.

**Платформа:** Android TV / Web

**Технологічний стек:** Android TV, Media Server, Web Admin Panel

**Статус:** У активній розробці

**Ключові особливості:**
- Веб-адмінпанель для завантаження та керування бібліотекою фільмів
- Автоматичне підтягування обкладинок, описів і метаданих
- Інтерфейс для Android TV, адаптований під керування пультом
- Повністю локальна робота без затримок і залежності від хмарних сервісів

**Репозиторій:** наразі закритий (проєкт у стадії активної розробки)